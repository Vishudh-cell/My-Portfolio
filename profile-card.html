<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile Card</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: aliceblue;
            color: rgb(34, 34, 34);
            text-align: center;
            margin: 0;
            padding: 30px 15px;
        }

        .card {
            background-color: white;
            border: 1px solid rgb(196, 211, 232);
            width: 300px;
            max-width: 90%;
            margin: 20px auto;
            padding: 20px;
        }

        .top {
            background-color: rgb(225, 235, 250);
            padding: 20px;
            margin: -20px -20px 15px -20px;
        }

        img {
            width: 125px;
            height: 125px;
            object-fit: cover;
            border: 2px solid white;
            border-radius: 50%;
        }

        h1 {
            font-size: 24px;
            color: rgb(36, 70, 117);
        }

        p {
            font-size: 15px;
            line-height: 1.5;
        }

        a {
            color: rgb(40, 90, 158);
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="top">
            <img src="kazim-photo.jpeg" alt="Photo of Kaazim">
        </div>
        <h1>Kaazim</h1>
        <p>19 years old</p>
        <p>Bangalore, Karnataka, India</p>
        <p>Student at Scaler School of Technology</p>
        <p>Pursuing IIT Madras BS in Data Science and Applications</p>
        <p>Interests: Technology, Taekwondo, Art and Photography</p>
    </div>

    <p><a href="projects.html">Back to Projects</a></p>
</body>
</html>
